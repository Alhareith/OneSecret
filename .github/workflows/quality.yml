name: بوابة جودة OneSecret

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: واجهة React وTypeScript
    runs-on: ubuntu-latest
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: إعداد pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: تثبيت اعتماديات الواجهة
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: فحص TypeScript
        working-directory: frontend
        run: pnpm check
      - name: بناء واجهة الإنتاج
        working-directory: frontend
        run: pnpm build

  backend:
    name: خادم Python واختباراته
    runs-on: ubuntu-latest
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4
      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: تثبيت اعتماديات الخادم
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: تشغيل pytest
        working-directory: backend
        run: pytest -q
